name: CI — Build & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Full Build (Type Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API (TypeScript compile)
        run: npx turbo run build --filter=@ajitsir/api

      - name: Build Web (Next.js + TypeScript)
        run: npx turbo run build --filter=web
        env:
          # Provide dummy values so Next.js can build without a live backend
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_dummy
